  <script>
    // Apply the saved theme (or the system setting) before the page renders, so there's no light/dark flash
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-white dark:bg-dark-mode blueprint font-primary">
